version: '3.8'

services:
  # ==========================================================
  # 1. Fastify WhatsApp API Gateway Backend
  # ==========================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-whatsapp-super-secret-key-32-chars!}
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-whatsapp_gateway}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MEDIA_STORAGE_PATH=/app/data/media
      - SESSION_STORAGE_PATH=/app/data/sessions
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - whatsapp_network

  # ==========================================================
  # 2. Next.js 14 Dashboard Frontend
  # ==========================================================
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000}
    container_name: whatsapp_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000}
    depends_on:
      - backend
    networks:
      - whatsapp_network

  # ==========================================================
  # 3. PostgreSQL Database
  # ==========================================================
  postgres:
    image: postgres:16-alpine
    container_name: whatsapp_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-whatsapp_gateway}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - whatsapp_network

  # ==========================================================
  # 4. Redis Queue & Rate Limiting Cache
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: whatsapp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - whatsapp_network

# ==========================================================
# Persistent Storage Volumes
# ==========================================================
volumes:
  backend_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ==========================================================
# Network Bridge
# ==========================================================
networks:
  whatsapp_network:
    driver: bridge
