services:
  # Fastify WhatsApp API Gateway Backend
  - type: web
    name: whatsapp-api-gateway
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

databases:
  # Free PostgreSQL Database on Render
  - name: whatsapp-db
    plan: free
    region: oregon
    databaseName: whatsapp_gateway
    user: whatsapp
